name: PR to ServiceNow Change Sync

on:
  pull_request:
    types: [labeled, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: servicenow-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync-servicenow:
    if: >-
      (github.event.action == 'labeled' &&
       github.event.label.name == 'servicenow-change') ||
      (github.event.action == 'closed' &&
       github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'servicenow-change'))
    runs-on: ubuntu-latest

    steps:
      - name: Create or update ServiceNow Change Request
        env:
          SN_INSTANCE: ${{ vars.SN_INSTANCE }}
          SN_CI_SYS_ID: f58112fc8324d750bfeb66d0deaad3d5
          SN_GROUP_SYS_ID: 2024def08364d750bfeb66d0deaad3c8
          SN_CLIENT_ID: ${{ secrets.SN_CLIENT_ID }}
          SN_CLIENT_SECRET: ${{ secrets.SN_CLIENT_SECRET }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_REPO: ${{ github.repository }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_ACTION: ${{ github.event.action }}
          PR_MERGED_AT: ${{ github.event.pull_request.merged_at }}
          PR_MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          : "${SN_INSTANCE:?Missing SN_INSTANCE variable}"
          : "${SN_CLIENT_ID:?Missing SN_CLIENT_ID secret}"
          : "${SN_CLIENT_SECRET:?Missing SN_CLIENT_SECRET secret}"

          INSTANCE="${SN_INSTANCE%/}"
          API="${INSTANCE}/api/now/table/change_request"

          echo "Requesting ServiceNow OAuth token..."

          TOKEN_RESPONSE=$(curl --fail-with-body -sS \
            -X POST "${INSTANCE}/oauth_token.do" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=${SN_CLIENT_ID}" \
            --data-urlencode "client_secret=${SN_CLIENT_SECRET}")

          ACCESS_TOKEN=$(jq -er '.access_token' <<< "$TOKEN_RESPONSE")
          echo "::add-mask::${ACCESS_TOKEN}"
          unset TOKEN_RESPONSE

          echo "Checking for existing Change Request..."

          LOOKUP=$(curl --fail-with-body -sS -G "${API}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Accept: application/json" \
            --data-urlencode "sysparm_query=correlation_id=${PR_URL}" \
            --data-urlencode "sysparm_fields=sys_id,number" \
            --data-urlencode "sysparm_limit=1")

          SYS_ID=$(jq -r '.result[0].sys_id // empty' <<< "$LOOKUP")
          CHG_NUM=$(jq -r '.result[0].number // empty' <<< "$LOOKUP")

          if [ "$PR_ACTION" = "closed" ]; then
            if [ -z "$SYS_ID" ]; then
              echo "No linked Change Request found. Nothing to update."
              exit 0
            fi

            NOTE=$(printf \
              'GitHub PR #%s was merged.\nRepository: %s\nPR: %s\nMerged by: %s\nMerged at: %s' \
              "$PR_NUMBER" "$PR_REPO" "$PR_URL" \
              "$PR_MERGED_BY" "$PR_MERGED_AT")

            PAYLOAD=$(jq -n --arg note "$NOTE" \
              '{work_notes: $note}')

            curl --fail-with-body -sS -X PATCH "${API}/${SYS_ID}" \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              --data "$PAYLOAD" > /dev/null

            echo "Updated work notes for ${CHG_NUM}."
            echo "Change Request remains open."
            exit 0
          fi

          if [ -n "$SYS_ID" ]; then
            echo "Existing Change Request: ${CHG_NUM}"
            echo "No duplicate created."
            exit 0
          fi

          PLANNED_START=$(date -u '+%Y-%m-%d %H:%M:%S')

          DESCRIPTION=$(printf \
            'Repository: %s\nPull Request: %s\nAuthor: %s\nSource branch: %s\nTarget branch: %s\n\nPR description:\n%s' \
            "$PR_REPO" "$PR_URL" "$PR_AUTHOR" \
            "$PR_BRANCH" "$PR_BASE" "$PR_BODY")

          PAYLOAD=$(jq -n \
            --arg title "GitHub PR #${PR_NUMBER}: ${PR_TITLE}" \
            --arg description "$DESCRIPTION" \
            --arg correlation "$PR_URL" \
            --arg ci "$SN_CI_SYS_ID" \
            --arg group "$SN_GROUP_SYS_ID" \
            --arg planned_start "$PLANNED_START" \
            '{
              short_description: $title,
              description: $description,
              correlation_id: $correlation,
              type: "normal",
              category: "Other",
              cmdb_ci: $ci,
              assignment_group: $group,
              start_date: $planned_start,
              impact: "3",
              urgency: "3",
              priority: "4",
              risk: "3"
            }')

          RESPONSE=$(curl --fail-with-body -sS -X POST "${API}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data "$PAYLOAD")

          CHG_NUM=$(jq -er '.result.number' <<< "$RESPONSE")
          SYS_ID=$(jq -er '.result.sys_id' <<< "$RESPONSE")

          echo "Created ServiceNow Change Request: ${CHG_NUM}"

          SN_URL="${INSTANCE}/change_request.do?sys_id=${SYS_ID}"

          gh pr comment "$PR_URL" \
            --body "ServiceNow Change Request created: [${CHG_NUM}](${SN_URL}). The change will remain open after this PR is merged."
